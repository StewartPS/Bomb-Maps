<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="Live updates during unexploded ordnance incidents across Devon and Cornwall, alongside the interactive WWII bombing map.">
    <link rel="canonical" href="https://bombmaps.co.uk/news.html">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Bomb Maps">
    <meta property="og:url" content="https://bombmaps.co.uk/news.html">
    <meta property="og:title" content="Latest updates — Bomb Maps">
    <meta property="og:description" content="Live updates during unexploded ordnance incidents across Devon and Cornwall.">
    <meta property="og:locale" content="en_GB">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230b0f17'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%2300f2fe' stroke-width='2' opacity='.5'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='none' stroke='%2300f2fe' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23ff5252'/%3E%3C/svg%3E">
    <meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">

    <!-- Same pre-paint theme bootstrap as index.html — without it, navigating
         between the two pages flashes light on a dark-mode device. -->
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("pbm-theme"); } catch (e) { /* private mode */ }
        var pref = stored === "light" || stored === "dark" ? stored : null;
        var resolved = pref || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", resolved);
        document.documentElement.setAttribute("data-theme-pref", pref || "system");
      })();
    </script>

    <!-- Google Analytics (GA4). Keep GA_ID identical to index.html —
         see the fuller explanation in that file's head. Inert until set.
         Consent granted by default, no banner; advertising storage
         always denied. -->
    <script>
      window.GA_ID = "G-909MJHFEHN";
      (function () {
        if (!window.GA_ID || window.GA_ID.indexOf("G-X") === 0) return;

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };

        gtag("consent", "default", {
          ad_storage: "denied",
          ad_user_data: "denied",
          ad_personalization: "denied",
          analytics_storage: "granted"
        });

        gtag("js", new Date());
        gtag("config", window.GA_ID, { anonymize_ip: true });
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + window.GA_ID;
        document.head.appendChild(s);
      })();
    </script>

    <!-- ============================================================
         CACHE BUSTING — bump ?v= on every release
         ------------------------------------------------------------
         GitHub Pages tells browsers to hang on to CSS and JS, so a push
         alone doesn't reach anyone who has already visited: they keep the
         old files until the cache expires. Changing the query string makes
         the URL new, so the browser has no choice but to fetch it.

         To release: find and replace ?v=1.13.0 with the next number in BOTH
         index.html and news.html. Nothing else needs touching.
         ============================================================ -->
    <link rel="stylesheet" href="css/style.css?v=1.13.0">
  </head>
  <body>
    <!-- Same persistent use-of-data warning as the map page. Static here:
         there is no sticky map chrome under it to stay clear of. -->
    <div class="use-warning" role="note" aria-label="Data use warning">
      <div class="use-warning-inner">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <path d="M12 9v4M12 17h.01"/>
        </svg>
        <p class="use-warning-text">
          <strong>For archival and historical use only.</strong>
          Do not use for land development or construction risk assessment.
        </p>
      </div>
    </div>

    <header class="site-header">
      <nav class="nav" aria-label="Primary">
        <a class="brand" href="index.html#top" aria-label="Bomb Maps home">
          <svg class="brand-mark" viewBox="0 0 32 32" width="36" height="36" aria-hidden="true" focusable="false">
            <circle cx="16" cy="16" r="15" fill="#0b0f17"/>
            <circle cx="16" cy="16" r="10" fill="none" stroke="#00f2fe" stroke-width="2" opacity=".5"/>
            <circle cx="16" cy="16" r="5.5" fill="none" stroke="#00f2fe" stroke-width="2"/>
            <circle cx="16" cy="16" r="2" fill="#ff5252"/>
          </svg>
          <span class="brand-text">Bomb<span class="brand-text-accent">Maps</span></span>
        </a>
        <div class="nav-links">
          <a href="index.html#map-section">Map</a>
          <a href="index.html#facts">Timeline</a>
          <a href="news.html" aria-current="page">News</a>
          <a href="index.html#sources">Sources</a>
        </div>
      </nav>
    </header>

    <main class="news-page" id="top">
      <!-- Everything below is rendered by js/news.js from data/incident.json.
           The noscript block and the loading state mean the page is never
           blank, whatever happens. -->
      <div class="news-shell" id="newsShell">
        <p class="news-loading" id="newsLoading">Loading latest updates&hellip;</p>
      </div>

      <noscript>
        <div class="news-empty">
          <h1>Latest updates</h1>
          <p>This page needs JavaScript to show live incident updates. For official
             information during an incident, follow
             <a href="https://www.plymouth.gov.uk/news/major-incident-updates" target="_blank" rel="noopener">Plymouth City Council</a>
             and <a href="https://www.devon-cornwall.police.uk/news/" target="_blank" rel="noopener">Devon &amp; Cornwall Police</a>.</p>
        </div>
      </noscript>
    </main>

    <footer class="site-footer">
      <p>Created by Stewart PS</p>
      <a class="coffee-btn" id="coffeeBtn" href="https://buymeacoffee.com/stewartps" target="_blank" rel="noopener" aria-label="Buy me a coffee">
        <span class="coffee-emoji" aria-hidden="true">&#9749;</span> Buy me a coffee
      </a>
    </footer>

    <script src="js/news.js?v=1.13.0"></script>
  </body>
</html>
